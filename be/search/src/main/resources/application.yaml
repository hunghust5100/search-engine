spring:
  application:
    name: search
  datasource:
    url: jdbc:h2:file:../data/db/hust_search;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

app:
  search:
    lucene:
      index-dir: ../data/lucene-index
    vncorenlp:
      models-base-dir: ../models/vncorenlp
      annotators:
        - wseg
    crawler:
      seed-urls:
        - https://hust.edu.vn
      allowed-domain-suffix: hust.edu.vn
      max-pages: 500
      max-depth: 4
      delay-ms: 300
      timeout-ms: 10000
      user-agent: HustSearchBot/1.0
